# 데스크톱 앱 릴리스 — 태그 v* 를 푸시하면 macOS·Windows 설치 파일을 만들어 GitHub Release **초안**에 올린다
# (electron-builder --publish always, 업데이트 메타 latest-mac.yml·latest.yml 포함). 초안을 공개하는 건 사람이 한다.
#
# 필요한 저장소 설정:
#   Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLIC_KEY   (운영 Supabase — Publishable 키 sb_publishable_…, 공개 가능)
#   Secrets(선택, 맥 서명·공증): CSC_LINK(.p12 base64), CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   없으면 임시(ad-hoc) 서명으로 빌드한다(첫 실행 때 '그래도 열기', 자동 업데이트는 릴리스 페이지 열기로 대체). 빈 시크릿은 빌드 단계에서 지운다.
name: desktop-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLIC_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 맥 서명 — 시크릿이 없으면 electron-builder 가 서명을 건너뛰도록 자동 탐색을 끈다
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check env
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL variable is empty"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLIC_KEY" || { echo "::error::VITE_SUPABASE_PUBLIC_KEY variable is empty"; exit 1; }

      - name: Build and publish (draft release)
        shell: bash
        run: |
          # 등록 안 된 시크릿은 빈 문자열로 들어온다. 빈 CSC_LINK 를 electron-builder 가 인증서 파일 경로로 읽어
          # 프로젝트 폴더를 열다 "not a file" 로 멈추므로(2026-10-31 첫 릴리스에서 실제로 실패), 비어 있는 서명 값은 아예 지운다.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm build:desktop --publish always
