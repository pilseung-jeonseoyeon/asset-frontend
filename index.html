<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: 홈 화면에서 전체화면(standalone)으로 열렸을 때 env(safe-area-inset-*)가
         실제 값을 갖게 한다. 하단탭·바텀시트가 이미 이 값으로 홈 인디케이터를 피한다(docs/mobile.md). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 홈 화면에 추가(PWA). iOS는 SVG 파비콘을 홈 아이콘으로 쓰지 않고 apple-touch-icon PNG만 쓴다 —
         이 태그가 없으면 <title> 첫 글자로 회색 "M" 타일을 만든다. 안드로이드는 manifest의 PNG를 쓴다.
         PNG 원본과 다시 뽑는 법은 scripts/app-icon/index.html 상단 주석.
         *-web-app-capable=yes 는 주소창 없는 전체화면으로 여는 설정이다. 이 모드는 사파리와
         쿠키·저장소가 분리되므로 홈 화면에서 처음 열 때 로그인을 한 번 다시 해야 한다(의도된 동작).
         status-bar-style=black-translucent 는 상태바를 투명하게 웹 콘텐츠 위에 겹쳐 그리고,
         웹 콘텐츠는 화면 전체(상태바 뒤까지) 높이를 차지한다는 뜻이다 — apple-touch-startup-image
         스플래시도 항상 화면 전체 높이를 기준으로 중앙에 로고를 그리므로, 두 화면이 같은 기준으로
         계산돼야 스플래시 → 실제 페이지로 넘어갈 때 로고 위치가 어긋나지 않는다(2026-09-03,
         default였을 때는 웹 콘텐츠가 상태바 아래부터 시작해 로고가 살짝 아래로 튀어 보였다).
         이 모드에서는 콘텐츠가 상태바 뒤까지 깔리므로, 헤더처럼 화면 맨 위에 붙는 요소는
         env(safe-area-inset-top)만큼 여백을 더해 시계·배터리 아이콘과 겹치지 않게 해야 한다
         (AuthenticatedApp.tsx의 모바일 main padding 참고).
         theme-color 는 안드로이드 상태바·앱 전환 화면 색이다. 라이트 --canvas 값을 초기값으로
         두고, 테마가 바뀌면 src/utils/theme.ts의 applyTheme이 content를 갈아끼운다.
         /pwa/ 와 manifest.webmanifest 는 vercel.json rewrite 예외에 들어가 있어야 한다. -->
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Monit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F4F5F7" />

         없으면 흰 화면. iOS는 device-width/height/pixel-ratio가 정확히 일치하는 것만 쓰므로 기종별로
         한 장씩 있고, 라이트/다크는 시스템 설정(prefers-color-scheme)을 따른다(앱 내 테마 설정과

    <!-- Source: secret/Asset Manager v14.dc.html L13-16 — 원본은 여기서 CDN 스타일시트 2개를 직접
         링크했지만, 폰트는 public/fonts/ 에 두고 우리 도메인에서 서빙하는 방식으로 바꿨다.
         @font-face 선언과 그 이유는 src/styles/fonts.css 헤더 주석 참고.
         아래 preload는 첫 화면(로그인)에 실제로 쓰이는 글자를 세어 상위 2개 조각만 당겨온다 —
         subset.91은 라틴 문자와 '가' 등, subset.90은 로그인 화면 한글의 대부분을 담는다.
         나머지 90개는 브라우저가 unicode-range를 보고 필요할 때만 받는다.

         아이콘 폰트(370KB)는 일부러 preload하지 않는다 — 로그인 화면이 쓰는 아이콘은 4개뿐인데
         preload로 최우선 순위를 주면 정작 급한 CSS/JS와 대역폭을 다툰다. fonts.css에서
         font-display: swap이라 늦게 도착해도 텍스트 렌더를 막지 않는다. -->
    <link rel="preload" href="/fonts/pretendard/PretendardVariable.subset.91.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/pretendard/PretendardVariable.subset.90.woff2" as="font" type="font/woff2" crossorigin>
    <title>Monit</title>

    <!-- 링크 미리보기(Open Graph) — 카카오톡·슬랙·페이스북 등이 링크를 붙일 때 읽어가는 정보다.
         이게 없으면 카카오톡은 제목만 <title>에서 가져가고 설명 자리에 자기 기본 문구
         ("여기를 눌러 링크를 확인하세요.")를 넣고 이미지는 아예 띄우지 않는다.

         이 앱은 SPA라 크롤러가 자바스크립트를 실행하지 않지만, 공유되는 주소는 루트 하나뿐이므로
         여기 정적으로 박아두면 충분하다. 화면별로 다른 미리보기가 필요해지면 그때는 서버/함수에서
         주소별로 태그를 바꿔 내려줘야 한다.

         주의:
         - og:image는 반드시 절대 URL(https://...)이어야 한다. 상대경로는 카카오가 무시한다.
         - 이미지는 PNG/JPG만 인정된다(SVG·WebP 안 됨). /og-image.png는 vercel.json의 rewrite
           예외 목록에도 들어가 있어야 index.html로 덮이지 않는다.
         - 이미지 원본은 scripts/og-image/index.html 이다. 아래 문구를 고치면 그 파일도 같이
           고치고 PNG를 다시 뽑을 것(다시 뽑는 명령은 그 파일 상단 주석에 있다).
         - 카카오는 URL별 미리보기를 며칠간 캐시한다. 배포 후 카카오 개발자사이트의 디버거에서
           캐시를 초기화해야 기존 대화방에도 새 미리보기가 뜬다.
         - og:image 뒤의 ?v= 는 이미지 캐시 무효화용이다(2026-08-27, 로고를 확정 심볼로 교체하며
           추가). 파일명이 그대로면 슬랙·트위터 등은 예전 이미지를 계속 들고 있으므로, 배너를 다시
           뽑을 때마다 이 숫자를 올린다. 쿼리는 경로 매칭에 영향이 없어 vercel.json은 손대지
           않아도 된다. 다만 **카카오는 이걸로 해결되지 않는다** — 카카오가 캐시하는 것은 이미지가
           아니라 공유된 페이지 주소(monit.io.kr)의 수집 결과이므로 위 디버거 초기화가 반드시
           필요하다. -->
    <meta name="description" content="흩어진 자산을 한곳에서. 예금·주식·가계부까지 한 화면으로." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monit" />
    <meta property="og:title" content="Monit" />
    <meta property="og:description" content="흩어진 자산을 한곳에서. 예금·주식·가계부까지 한 화면으로." />
    <meta property="og:url" content="https://monit.io.kr" />
    <meta property="og:image" content="https://monit.io.kr/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Monit — 흩어진 자산을 한곳에서" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monit" />
    <meta name="twitter:description" content="흩어진 자산을 한곳에서. 예금·주식·가계부까지 한 화면으로." />
    <meta name="twitter:image" content="https://monit.io.kr/og-image.png?v=2" />

    <!-- 첫 페인트 전 테마 적용. main.tsx는 type="module"이라 지연 실행되고, 프로덕션 빌드에서는
         CSS <link>가 렌더를 막는 동안 흰 화면이 먼저 그려질 수 있다 — 동기 인라인 스크립트만
         이 섬광(FOUC)을 확실히 막는다. src/utils/theme.ts의 readStoredTheme/isDarkTheme 로직을
         이 시점엔 모듈을 import할 수 없어 5줄가량 그대로 옮겨 적었다(두 곳을 같이 고칠 것).
         localStorage 접근 실패(사파리 프라이빗 등)는 try/catch로 삼켜 앱이 죽지 않게 한다. -->
    <script>
      try {
        var t = window.localStorage.getItem('monit.theme');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('theme-dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
