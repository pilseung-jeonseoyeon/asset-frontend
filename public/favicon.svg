<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Monit 앱 로고 — 확정 심볼 "볼 터미널 M". 도형은 secret/monit-symbol-spec.md §3-1(라이트)
       코드를 그대로 옮긴 것이고, src/components/layout/MonitLogo.tsx의 라이트 변형과 같은 도형이다.
       그 컴포넌트를 고칠 때 이 파일도 같이 고쳐야 한다 — 파비콘은 빌드가 SVG를 그대로 복사하므로
       자동으로 따라가지 않는다.
       다크 변형은 타일 그라데이션과 헤어라인 보더만 다른데, 파비콘은 16~32px로 렌더되어
       구분이 불가능하므로 라이트 변형 하나만 둔다(디자인 룰 9-2-2 variant 03도 파비콘은
       평면 단색 #2A2E5C). 배경이 짙은 남색이라 브라우저 탭이 밝든 어둡든 흰 M이 그대로 보인다. -->
  <defs>
    <linearGradient id="monit-ov-favicon" gradientUnits="userSpaceOnUse" x1="38.48" y1="62.89" x2="47.46" y2="53.91">
      <stop offset="0" stop-color="#6761CD" stop-opacity="0" />
      <stop offset="1" stop-color="#6761CD" stop-opacity=".76" />
    </linearGradient>
    <clipPath id="monit-clip-favicon"><rect width="100" height="100" rx="24.26" ry="24.26" /></clipPath>
  </defs>
  <rect width="100" height="100" rx="24.26" ry="24.26" fill="#2A2E5C" />
  <path d="M47.75 44.92 L47.75 91.8 L0.88 91.8 Z" fill="url(#monit-ov-favicon)" clip-path="url(#monit-clip-favicon)" />
  <circle cx="78.22" cy="27.15" r="5.57" fill="#6979F8" />
