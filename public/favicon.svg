<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Monit 앱 로고. src/components/layout/MonitLogo.tsx(라이트 변형)와 같은 도형이다.
       그 컴포넌트를 고칠 때 이 파일도 같이 고쳐야 한다 — 파비콘은 빌드가 SVG를 그대로 복사하므로
       자동으로 따라가지 않는다.
       다크 변형은 그라데이션 명도와 점 색만 미세하게 다른데, 파비콘은 16~32px로 렌더되어
       구분이 불가능하므로 라이트 변형 하나만 둔다. 배경이 짙은 남색이라 브라우저 탭이
       밝든 어둡든 흰 M이 그대로 보인다. -->
  <defs>
    <linearGradient id="monit-favicon-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363C74" />
      <stop offset="1" stop-color="#1F2247" />
    </linearGradient>
  </defs>
  <path d="M50,0 C14,0 0,14 0,50 C0,86 14,100 50,100 C86,100 100,86 100,50 C100,14 86,0 50,0 Z" fill="url(#monit-favicon-bg)" />
  <path d="M28,62 L28,34 L50,55 L72,34 L72,74" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="28" cy="68" r="8.5" fill="#ABA5E4" />
</svg>
